[project]
name = "graylog-app"
version = "0.1.0"
description = "Quản lý đăng nhập Graylog của nhiều đối tác và xem log"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"

[project.scripts]
gl = "graylog_app:gl"

[project.gui-scripts]
graylog-app = "graylog_app:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
